; LilyGo T-Deck
[t_deck_base]
custom_meshtastic_hw_model = 50
custom_meshtastic_hw_model_slug = T_DECK
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Deck
custom_meshtastic_images = t-deck.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board_level = release
board = t-deck
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t-deck>

build_flags = ${esp32s3_base.build_flags} 
  -D T_DECK 
  -D BOARD_HAS_PSRAM
  # EXPERIMENT: vendored SAM text-to-speech (Read Aloud). Reachable only on BaseUI
  # builds; the MUI/tft env compiles it but has no menu entry for it.
  -D MESHTASTIC_ENABLE_TTS
  ; The card, the panel and LoRa all share the default SPI bus; spiLock serialises them.
  ; Both UIs mount it, so it belongs here rather than in variant.h.
  -D HAS_SDCARD
  -I variants/esp32s3/t-deck

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip

[env:t-deck]
extends = t_deck_base
build_src_filter =
  ${t_deck_base.build_src_filter}
  +<graphics/emotes_color.cpp>
  -<graphics/emotes.cpp>
build_flags =
  ${t_deck_base.build_flags}
  -D BASEUI_HAS_GAMES=1
  -D GAMES_ANNOUNCE_HIGH_SCORE=1
  -D GAME_DEMO_MODE=0
  -D BASEUI_HAS_MAP=1
  ; Swipe-aware nav bar, same as t-watch-ultra: the current frame's icon stays highlighted
  ; in the center slot while the rest slide past it in sync with the drag/transition,
  ; instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1
  ; Swiping and the on-screen map buttons are how you drive this panel - don't let a stray tap
  ; page the screen too. The keyboard and trackball still raise the same event and keep working.
  -D BASEUI_TAP_ADVANCES_FRAME=0
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Colour emote bitmaps from emotes_color.cpp; ones without a colour version stay 1-bit.
  -D BASEUI_COLOR_EMOTES=1
  ; Colour map tiles from the SD card in device-ui's /maps/<style>/z/x/y.png layout; MAP.BIN when absent.
  -D BASEUI_MAP_PNG_TILES=1
  ; Fetch missing tiles over WiFi from /maps/<style>/.url and cache them to the card. On demand only.
  -D BASEUI_MAP_ONLINE_TILES=1
  ; Web server reads a request body 512 bytes per socket read by default; bigger reads speed up SD uploads.
  -D HTTPS_CONNECTION_DATA_CHUNK_SIZE=4096
  ; FTP to the SD card (FTP_SERVER in variant.h). The library defaults ESP32 storage to FFAT, so the SD
  ; selection is not optional - it is what points MultiFTPServer at the card setupSDCard() mounts.
  -D DEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
  -D DEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD

lib_deps =
  ${t_deck_base.lib_deps}
  # renovate: datasource=git-refs depName=PNGdec packageName=https://github.com/mverch67/PNGdec gitBranch=mverch67-patch-1
  https://github.com/mverch67/PNGdec/archive/d88b6fe2ec8d49c2b097a529b34d1d615ca5cf1b.zip
  https://github.com/mverch67/MultiFTPServer/archive/0e854335b9916ed9f2d3bcfe68975ce746992ccd.zip

; Internal DRAM is the scarce pool once the colour BaseUI is on: the two RGB565 frame buffers go to
; PSRAM, but WiFi, NimBLE and mbedTLS all take theirs from internal SRAM. Same set as the M9 - comment
; a single line to bisect if something turns flaky. HTTPClient is off under Arduino selective
; compilation, so online map tiles would not link without the last line.
custom_sdkconfig =
  ${t_deck_base.custom_sdkconfig}
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  CONFIG_ARDUINO_SELECTIVE_HTTPClient=y

[env:t-deck-tft]
extends = t_deck_base
board_level = pr

extra_scripts =
  ${t_deck_base.extra_scripts}
  extra_scripts/ld_response_file.py

build_flags =
  ${t_deck_base.build_flags}
  -D CONFIG_DISABLE_HAL_LOCKS=1 ; "feels" to be a bit more stable without locks
  -D INPUTDRIVER_I2C_KBD_TYPE=0x55
  -D INPUTDRIVER_ENCODER_TYPE=3
  -D INPUTDRIVER_ENCODER_LEFT=1
  -D INPUTDRIVER_ENCODER_RIGHT=2
  -D INPUTDRIVER_ENCODER_UP=3
  -D INPUTDRIVER_ENCODER_DOWN=15
  -D INPUTDRIVER_ENCODER_BTN=0
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_SPI_PARANOID=0
  -D CALIBRATE_TOUCH=0
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_BUFSIZE=153600
  -D DISPLAY_SIZE=320x240 ; landscape mode
  -D LGFX_DRIVER=LGFX_TDECK
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_T_DECK.h\"
;  -D LVGL_DRIVER=LVGL_TDECK
;  -D GFX_DRIVER_INC=\"graphics/LVGL/LVGL_T_DECK.h\"
;  -D LV_USE_ST7789=1
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
;  -D CUSTOM_TOUCH_DRIVER

lib_deps =
  ${t_deck_base.lib_deps}
  ${device-ui_base.lib_deps}
  ;https://github.com/bitbank2/bb_captouch/archive/refs/tags/1.3.1.zip

custom_sdkconfig =
  ${t_deck_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
