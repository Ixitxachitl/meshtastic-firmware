; LilyGo T-Deck
[env:t-deck]
custom_meshtastic_hw_model = 50
custom_meshtastic_hw_model_slug = T_DECK
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Deck
custom_meshtastic_images = t-deck.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board_level = release
board = t-deck
board_build.partitions = default_16MB.csv
upload_protocol = esptool

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t-deck>

build_flags = ${esp32s3_base.build_flags} 
  -D T_DECK 
  -D BOARD_HAS_PSRAM
  # EXPERIMENT: vendored SAM text-to-speech (Read Aloud). Reachable only on BaseUI
  # builds; the MUI/tft env compiles it but has no menu entry for it.
  -D MESHTASTIC_ENABLE_TTS
  -I variants/esp32s3/t-deck

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.27
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip

[env:t-deck-tft]
extends = env:t-deck
board_level = pr

extra_scripts =
  ${env:t-deck.extra_scripts}
  extra_scripts/ld_response_file.py

build_flags =
  ${env:t-deck.build_flags}
  -D CONFIG_DISABLE_HAL_LOCKS=1 ; "feels" to be a bit more stable without locks
  -D INPUTDRIVER_I2C_KBD_TYPE=0x55
  -D INPUTDRIVER_ENCODER_TYPE=3
  -D INPUTDRIVER_ENCODER_LEFT=1
  -D INPUTDRIVER_ENCODER_RIGHT=2
  -D INPUTDRIVER_ENCODER_UP=3
  -D INPUTDRIVER_ENCODER_DOWN=15
  -D INPUTDRIVER_ENCODER_BTN=0
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SDCARD
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_SPI_PARANOID=0
  -D CALIBRATE_TOUCH=0
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_BUFSIZE=153600
  -D DISPLAY_SIZE=320x240 ; landscape mode
  -D LGFX_DRIVER=LGFX_TDECK
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_T_DECK.h\"
;  -D LVGL_DRIVER=LVGL_TDECK
;  -D GFX_DRIVER_INC=\"graphics/LVGL/LVGL_T_DECK.h\"
;  -D LV_USE_ST7789=1
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
;  -D CUSTOM_TOUCH_DRIVER
  -D BASEUI_HAS_GAMES=1
  -D GAMES_ANNOUNCE_HIGH_SCORE=1
  -D GAME_DEMO_MODE=0
  -D BASEUI_HAS_MAP=1
  ; Swipe-aware nav bar, same as t-watch-ultra: the current frame's icon stays highlighted
  ; in the center slot while the rest slide past it in sync with the drag/transition,
  ; instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1

lib_deps =
  ${env:t-deck.lib_deps}
  ${device-ui_base.lib_deps}
  ;https://github.com/bitbank2/bb_captouch/archive/refs/tags/1.3.1.zip

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
