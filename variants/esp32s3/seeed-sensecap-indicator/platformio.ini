; Seeed Studio SenseCAP Indicator
[env:seeed-sensecap-indicator]
custom_meshtastic_hw_model = 70
custom_meshtastic_hw_model_slug = SENSECAP_INDICATOR
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed SenseCAP Indicator
custom_meshtastic_images = seeed-sensecap-indicator.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_partition_scheme = 8MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
platform_packages =
  ; Version needs to match the pioarduino version used in esp32_common.ini
  platformio/framework-arduinoespressif32 @ https://github.com/mverch67/arduino-esp32#046b8ba21c42b1a2fc84f175504f295e17a206d0 ; 3.3.12

board = seeed-sensecap-indicator
board_level = release
board_build.partitions = partition-table-8MB.csv
upload_protocol = esptool

; Colour emote data (BASEUI_COLOR_EMOTES) in place of the 1-bit set; the two define the same emotes[].
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<graphics/emotes_color.cpp>
  -<graphics/emotes.cpp>

build_flags = ${esp32s3_base.build_flags}
  -Ivariants/esp32s3/seeed-sensecap-indicator
  -DSENSECAP_INDICATOR
  -DUSE_ARDUINO_HAL_GPIO ; patch for lovyanGFX to use digitalWrite instead of direct register access for GPIO control, which is necessary for the IO expander to work correctly
  -DRADIOLIB_DEBUG_SPI=0
  -DRADIOLIB_DEBUG_PROTOCOL=0
  -DRADIOLIB_DEBUG_BASIC=0
  -DRADIOLIB_VERBOSE_ASSERT=0
  -DRADIOLIB_SPI_PARANOID=0
  -DIO_EXPANDER=0x40
  -DIO_EXPANDER_IRQ=42
  ;-DIO_EXPANDER_DEBUG
  ; BaseUI. Set here rather than on -tft, which inherits them: this env is the BaseUI-only build.
  -D BASEUI_HAS_MAP=1
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Keep the frame under an open menu or text prompt, so typing redraws the prompt, not the map behind it.
  -D BASEUI_MENU_BACKDROP=1
  ; Colour emote bitmaps from emotes_color.cpp; ones without a colour version stay 1-bit.
  -D BASEUI_COLOR_EMOTES=1
  ; Colour map tiles in device-ui's /maps/<style>/z/x/y.png layout, read from the RP2040's SD card over the
  ; interdevice link the same way device-ui reads them; MAP.BIN when absent.
  -D BASEUI_MAP_PNG_TILES=1
  ; Satellite imagery is served as JPEG; decode it too (stored under the same .png names).
  -D BASEUI_MAP_JPEG_TILES=1
  ; Fetch missing tiles over WiFi from /maps/<style>/.url and cache them to the card. On demand only.
  -D BASEUI_MAP_ONLINE_TILES=1
  ; Map > Navigate to a node, waypoint, typed position or (with online tiles) an address.
  -D BASEUI_MAP_NAVIGATION=1
  ; New Waypoint Here: name, note, emote pin and expiry, sent on the primary channel.
  -D BASEUI_WAYPOINT_EDITOR=1
  ; WiFi screen menu: scan, join with a typed password, and rejoin known networks.
  -D BASEUI_WIFI_MANAGER=1
  ; Swipe-aware nav bar, same as t-watch-ultra: the current frame's icon stays highlighted
  ; in the center slot while the rest slide past it in sync with the drag/transition,
  ; instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1
  ; Finger-tracked frame transitions, message/keyboard scrolling and the map's on-screen
  ; controls. A build flag, not a variant.h define: TouchScreenImpl1.h warns it resolves to 0
  ; wherever variant.h is not in the include path.
  -D BASEUI_HAS_TOUCH_DRAG=1

; Internal DRAM is the scarce pool once WiFi, NimBLE and mbedTLS are all up; 8MB of octal PSRAM takes what it can,
; as on the M9 and T-Deck. Without these a TLS handshake fails with "esp-aes: Failed to allocate memory".
; esp32_common turns HTTPClient off via Arduino selective compilation; online tiles, address search and routing need
; it. NetworkClientSecure is already on there, which is what carries the https requests.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  CONFIG_ARDUINO_SELECTIVE_HTTPClient=y
  ; Routing: the free Valhalla/OSRM servers (FOSSGIS, OSRM demo) refuse anything below TLS 1.3.
  CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y

lib_deps = ${esp32s3_base.lib_deps}
  https://github.com/mverch67/LovyanGFX/archive/9abe502add013f392a1898d7dc48d65ddc112754.zip
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip
  # renovate: datasource=git-refs depName=PNGdec packageName=https://github.com/mverch67/PNGdec gitBranch=mverch67-patch-1
  https://github.com/mverch67/PNGdec/archive/d88b6fe2ec8d49c2b097a529b34d1d615ca5cf1b.zip
  # renovate: datasource=github-tags depName=JPEGDEC packageName=bitbank2/JPEGDEC
  https://github.com/bitbank2/JPEGDEC/archive/refs/tags/1.8.4.zip

[env:seeed-sensecap-indicator-tft]
extends = env:seeed-sensecap-indicator
board_level = pr
upload_speed = 921600

build_flags =
  ${env:seeed-sensecap-indicator.build_flags}
  -D INPUTDRIVER_BUTTON_TYPE=38
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D DISPLAY_SET_RESOLUTION
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D CUSTOM_TOUCH_DRIVER
  -D LGFX_SCREEN_WIDTH=480
  -D LGFX_SCREEN_HEIGHT=480
  -D DISPLAY_SIZE=480x480
  -D LGFX_DRIVER=LGFX_INDICATOR
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_INDICATOR.h\"
  -D VIEW_320x240
  -D USE_PACKET_API

lib_deps =
  ${env:seeed-sensecap-indicator.lib_deps}
  ${device-ui_base.lib_deps}
  ;# renovate: datasource=github-tags depName=bb_captouch packageName=bitbank2/bb_captouch
  ;https://github.com/bitbank2/bb_captouch/archive/refs/tags/1.3.1.zip ; not working
  https://github.com/mverch67/bb_captouch/archive/8626412fe650d808a267791c0eae6e5860c85a5d.zip ; alternative touch library supporting FT6x36

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
