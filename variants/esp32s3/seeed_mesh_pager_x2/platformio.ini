[env:seeed_meshpager_x2_rev1]
custom_meshtastic_hw_model = 146
custom_meshtastic_hw_model_slug = MESHPAGER_X2
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed MeshPager X2
custom_meshtastic_images = meshpager_x2.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board = seeed_meshpager_x2
board_level = extra
board_check = true
upload_protocol = esptool
board_build.partitions = default_16MB.csv

; Build flags for MeshPager X2
build_flags = ${esp32s3_base.build_flags}
  -I variants/esp32s3/seeed_mesh_pager_x2
  -D SEEED_MESHPAGER_X2
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D INPUTDRIVER_DIRECTIONALPAD_TYPE=1
  -D INPUTDRIVER_DIRECTIONALPAD_INT=2
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_SPI_PARANOID=0
  ; Display Configuration
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  ; SD Card - 1-bit SDIO mode
  -D HAS_SDCARD
  -D HAS_SD_MMC
  -D SD_SCLK_PIN=15
  -D SD_MOSI_PIN=14
  -D SD_MISO_PIN=16
  -D SDCARD_CS=-1 ; control via IO Expander pin 13
  -D SD_SPI_FREQUENCY=40000000
  ; Memory Configuration
  -D RAM_SIZE=5120
  -D LGFX_BUFSIZE=153600
  -D LV_CACHE_DEF_SIZE=0
  ; Graphics/UI Configuration
  -D LGFX_DRIVER_TEMPLATE
  -D DISPLAY_SIZE=320x240
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D LGFX_PANEL=ST7789P3
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_INVERT_COLOR=true
  -D LGFX_RGB_ORDER=true
  -D LGFX_CFG_HOST=SPI2_HOST
  -D LGFX_PIN_SCK=12
  -D LGFX_PIN_MOSI=11
  -D LGFX_PIN_MISO=-1
  -D LGFX_PIN_DC=13
  -D LGFX_PIN_CS=10
  -D LGFX_PIN_RST=-1
  -D LGFX_PIN_BL=46
  -D LGFX_ROTATION=1
  -D SPI_FREQUENCY=80000000
  -D VIEW_320x240
  -D MAP_FULL_REDRAW
  -D USE_PACKET_API

build_src_filter = ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/seeed_mesh_pager_x2>

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  ; Audio processing and synthesis
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
  ; IO Expander (TCA6424)
  # renovate: datasource=pio depName=TCA9555 packageName=RobTillaart/library/TCA9555
  RobTillaart/TCA9555@0.4.4
  ; RTC (YSN8900E)
  # renovate: datasource=github-tags depName=mverch67_YSN8900ERTC packageName=mverch67/YSN8900ERTC
  https://github.com/mverch67/YSN8900ERTC/archive/refs/tags/V1.1.1.zip
  ; Display driver (ST7789)
  # renovate: datasource=pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.33
  ; Sensors: ADS1115 (if used), BMM350, SHT4x, LSM6DSO, etc.
  # renovate: datasource=github-tags depName=Adafruit_ADS1X15 packageName=adafruit/Adafruit_ADS1X15
  https://github.com/adafruit/Adafruit_ADS1X15/archive/refs/tags/2.6.2.zip
  ; BMM350 sensor
  https://github.com/DFRobot/DFRobot_BMM350/archive/1b58676b3f99b28c90feaf5aad3777e6921cc1e8.zip


custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

; Board revision with RETURN on ESP32-S3 GPIO 0 instead of TCA6424 P05. device-ui (MUI); the BaseUI build of
; this revision is env:seeed_meshpager_x2 below.
[env:seeed_meshpager_x2-tft]
extends = env:seeed_meshpager_x2_rev1
board_level = pr
build_flags =
  ${env:seeed_meshpager_x2_rev1.build_flags}
  -D INPUTDRIVER_DIRECTIONALPAD_RETURN_GPIO=0
  -D DISPLAY_POWER_BUTTON_ONLY
  -D X2_POWER_KEY_UI
  -D BUTTON_WAKE_ACTIVE_HIGH

; Personal BaseUI build of the current revision (RETURN on GPIO 0), with the ThinkNode M9's feature set: the two
; boards share the 320x240 landscape panel and page with keys. The device-ui build is env:seeed_meshpager_x2-tft.
[env:seeed_meshpager_x2]
custom_meshtastic_hw_model = 146
custom_meshtastic_hw_model_slug = MESHPAGER_X2
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed MeshPager X2
custom_meshtastic_images = meshpager_x2.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board = seeed_meshpager_x2
board_level = pr
board_check = true
upload_protocol = esptool
board_build.partitions = default_16MB.csv

build_src_filter = ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/seeed_mesh_pager_x2>
  +<graphics/emotes_color.cpp>
  -<graphics/emotes.cpp>

build_flags = ${esp32s3_base.build_flags}
  -I variants/esp32s3/seeed_mesh_pager_x2
  -D SEEED_MESHPAGER_X2
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D RADIOLIB_SPI_PARANOID=0
  -D HAS_SCREEN=1
  -D USE_I2S_BUZZER
  ; SD card - 1-bit SDIO mode; the map tiles read it through MapCardMmc.h
  -D HAS_SDCARD
  -D HAS_SD_MMC
  -D SD_SCLK_PIN=15
  -D SD_MOSI_PIN=14
  -D SD_MISO_PIN=16
  -D SDCARD_CS=-1 ; control via IO Expander pin 13
  -D SD_SPI_FREQUENCY=40000000
  -D SPI_FREQUENCY=80000000
  ; Not a device-ui setting here: variant.cpp parks the backlight pin through it for deep sleep.
  -D LGFX_PIN_BL=46
  ; This revision, as env:seeed_meshpager_x2-tft
  -D INPUTDRIVER_DIRECTIONALPAD_RETURN_GPIO=0
  -D DISPLAY_POWER_BUTTON_ONLY
  -D X2_POWER_KEY_UI
  -D BUTTON_WAKE_ACTIVE_HIGH
  ; No touchscreen, so the arrow keys are the only way to page frames - slide between them rather than snapping.
  -D SCREEN_ANIMATE_FRAME_NAV=1
  -D BASEUI_HAS_GAMES=1
  -D GAMES_ANNOUNCE_HIGH_SCORE=0
  -D GAME_DEMO_MODE=0
  ; The keypad reports presses but never a hold, so Breakout's arrows latch the paddle moving instead.
  -D BREAKOUT_TOGGLE_PADDLE=1
  -D BASEUI_HAS_MAP=1
  ; Up/down are free on the Map frame (left/right page frames): zoom with them, no Zoom menu entry.
  -D BASEUI_MAP_UPDOWN_ZOOMS=1
  ; Swipe-aware nav bar: the current frame's icon stays highlighted in the center slot while the rest
  ; slide past it in sync with the transition, instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D BASEUI_NATIVE_MIRROR=1 ; screen mirror streams the colour frame (rect pool in PSRAM)
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Colour emote bitmaps from emotes_color.cpp; ones without a colour version stay 1-bit.
  -D BASEUI_COLOR_EMOTES=1
  ; Colour map tiles from the SD card in device-ui's /maps/<style>/z/x/y.png layout; MAP.BIN when absent.
  -D BASEUI_MAP_PNG_TILES=1
  ; Satellite imagery is served as JPEG; decode it too (stored under the same .png names).
  -D BASEUI_MAP_JPEG_TILES=1
  ; Fetch missing tiles over WiFi from /maps/<style>/.url and cache them to the card. On demand only.
  -D BASEUI_MAP_ONLINE_TILES=1
  ; Map > Navigate to a node, waypoint, typed position or (with online tiles) an address.
  -D BASEUI_MAP_NAVIGATION=1
  ; New Waypoint Here: name, note, emote pin and expiry, sent on the primary channel.
  -D BASEUI_WAYPOINT_EDITOR=1
  ; WiFi screen menu: scan, join with a typed password, and rejoin known networks.
  -D BASEUI_WIFI_MANAGER=1
  ; Read Aloud through the ES8311 speaker, with the vendored SAM.
  -D MESHTASTIC_ENABLE_TTS

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
  # renovate: datasource=pio depName=TCA9555 packageName=RobTillaart/library/TCA9555
  RobTillaart/TCA9555@0.4.4
  # renovate: datasource=github-tags depName=mverch67_YSN8900ERTC packageName=mverch67/YSN8900ERTC
  https://github.com/mverch67/YSN8900ERTC/archive/refs/tags/V1.1.1.zip
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.35
  # renovate: datasource=github-tags depName=Adafruit_ADS1X15 packageName=adafruit/Adafruit_ADS1X15
  https://github.com/adafruit/Adafruit_ADS1X15/archive/refs/tags/2.6.2.zip
  https://github.com/DFRobot/DFRobot_BMM350/archive/1b58676b3f99b28c90feaf5aad3777e6921cc1e8.zip
  # renovate: datasource=git-refs depName=PNGdec packageName=https://github.com/mverch67/PNGdec gitBranch=mverch67-patch-1
  https://github.com/mverch67/PNGdec/archive/d88b6fe2ec8d49c2b097a529b34d1d615ca5cf1b.zip
  # renovate: datasource=github-tags depName=JPEGDEC packageName=bitbank2/JPEGDEC
  https://github.com/bitbank2/JPEGDEC/archive/refs/tags/1.8.4.zip

; Internal DRAM is the scarce pool with the colour BaseUI on, not PSRAM: as on the M9, move WiFi, NimBLE and mbedTLS
; buffers out. HTTPClient is off under Arduino selective compilation, so online map tiles would not link without it.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  CONFIG_ARDUINO_SELECTIVE_HTTPClient=y
  ; Routing: the free Valhalla/OSRM servers (FOSSGIS, OSRM demo) refuse anything below TLS 1.3.
  CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
