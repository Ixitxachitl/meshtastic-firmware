; LilyGo T-Watch S3
[env:t-watch-ultra]
custom_meshtastic_hw_model = 114
custom_meshtastic_hw_model_slug = T_WATCH_ULTRA
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = T-Watch Ultra
custom_meshtastic_images = t-watch-ultra.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board = t-watch-ultra
board_level = release
board_build.partitions = default_16MB.csv
upload_protocol = esptool

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ; Keep esp_littlefs buffers in internal RAM (off the shared-bus PSRAM).
  CONFIG_LITTLEFS_MALLOC_STRATEGY_INTERNAL=y
  CONFIG_SPI_FLASH_SHARE_SPI1_BUS=y

; esp32s3_base, not esp32_base: the classic-ESP32 base adds -Wl,--wrap=memcpy/memset,
; whose cache probe reads a DPORT register the S3 does not map (see IramMemcpy.c).
build_flags = ${esp32s3_base.build_flags} -Ivariants/esp32s3/t-watch-ultra
  ; Route flash reads through the cache/mmap path (esp_partition_read_mmap_wrap.c)
  ; to dodge the IDF 5.5 manual-read regression on this board's flash. esp_flash_read
  ; is wrapped too - nvs_flash reads through it directly, bypassing esp_partition_read.
  -Wl,--wrap=esp_partition_read
  -Wl,--wrap=esp_flash_read
  -D T_WATCH_ULTRA
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_LR11X0=1
  -D HAS_SDCARD
  -D BASEUI_HAS_MAP=1
  -D SDCARD_USE_SPI1
  -D SD_SPI_FREQUENCY=75000000
  -D SPI_MISO=33
  -D SPI_MOSI=34
  -D SPI_SCK=35
  -D SDCARD_CS=21
  ; Vendored SAM text-to-speech (Read Aloud), as this board had before the BackgroundAudio
  ; migration dropped the ESP8266SAM dependency.
  -D MESHTASTIC_ENABLE_TTS
  ; The MAX98357A's analog gain is pin-strapped, so digital amplitude is the only volume control.
  ; RtttlPcm defaults to 1536 (the old SetGain(0.2) equivalent), far too quiet here; 8192 is the
  ; generator's natural square-wave peak. Speech is boosted with saturation. These must be -D
  ; flags: RtttlPcm.h includes no variant header.
  -D AUDIO_RTTTL_AMPLITUDE=8192
  -D AUDIO_SPEECH_GAIN=2.0f
;  -DHAS_BMA423=1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/t-watch-ultra>

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=github-tags depName=LovyanGFX packageName=lovyan03/LovyanGFX
  https://github.com/lovyan03/LovyanGFX/archive/tags/1.2.27.zip
  # renovate: datasource=custom.pio depName=Adafruit DRV2605 packageName=adafruit/library/Adafruit DRV2605 Library
  adafruit/Adafruit DRV2605 Library@1.2.4
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.1

[env:t-watch-ultra-tft]
board_level = extra
extends = env:t-watch-ultra
build_flags =
  ${env:t-watch-ultra.build_flags}
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=5120
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_SPI_PARANOID=0
  -D LGFX_SCREEN_WIDTH=410
  -D LGFX_SCREEN_HEIGHT=502
  -D LGFX_AMOLED_ROUNDER=1
  -D LGFX_BUFSIZE=308732
  -D DISPLAY_SIZE=410x502 ; portrait mode
  -D DISPLAY_SET_RESOLUTION
  -D LGFX_DRIVER=LGFX_TWATCH_ULTRA
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_T_WATCH_ULTRA.h\"
;  -D LVGL_DRIVER=LVGL_T_WATCH_ULTRA
  -D VIEW_320x240
  -D USE_PACKET_API
  -D MAP_FULL_REDRAW
  -D CUSTOM_TOUCH_DRIVER

lib_deps =
  ${env:t-watch-ultra.lib_deps}
  ${device-ui_base.lib_deps}