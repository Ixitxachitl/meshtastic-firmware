[thinknode_m9_base]
custom_meshtastic_hw_model = 131
custom_meshtastic_hw_model_slug = THINKNODE_M9
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = ThinkNode M9
custom_meshtastic_images = thinknode_m9.svg
custom_meshtastic_tags = Elecrow
custom_meshtastic_requires_dfu = false
custom_meshtastic_partition_scheme = 16MB
custom_meshtastic_has_mui = true

extends = esp32s3_base
board = crowpanel
board_level = release
board_build.partitions = default_16MB.csv
upload_protocol = esptool
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/ELECROW-ThinkNode-M9>
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/ELECROW-ThinkNode-M9
  -D ELECROW_ThinkNode_M9
  -D BOARD_HAS_PSRAM
  -D HAS_SDCARD=1
  -D SDCARD_CS=48
  -D SDCARD_USE_SPI1
  -D SDCARD_SHARE_SPI
  -D SDCARD_INIT_SPI
  ; Over the 25MHz SD SPI spec (50MHz on a high-speed card); has produced I/O errors at random
  ; offsets under sustained writes. Drop to 20000000U if long transfers start failing again.
  -D SD_SPI_FREQUENCY=75000000U
  -D HAS_SCREEN=1
  ; LovyanGFX rounds this down to 80MHz/N, so anything from 41 to 79 MHz lands on 40 - 75 was 40.
  ; SCK/MOSI are not the SPI2 IOMUX pins, so drop back to 40000000 if the panel shows tearing.
  -D SPI_FREQUENCY=80000000
;  -D COMPASS_SENSOR_DEBUG=1
  ; Per-frame display timing once a second: frames drawn, ms converting/pushing pixels, ms blocked
  ; on spiLock. Pairs with the touch-poll cadence TouchScreenBase reports under the same flag.
;  -D UI_PERF_DEBUG=1
lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.26
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.4.1
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

[env:thinknode_m9]
extends = thinknode_m9_base
build_flags = 
  ${thinknode_m9_base.build_flags}
  ; No touchscreen on this board, so the arrow keys are the only way to page frames - slide
  ; between them rather than snapping. BaseUI only; the -tft env below is device-ui.
  -D SCREEN_ANIMATE_FRAME_NAV=1
  -D BASEUI_HAS_GAMES=1
  -D GAMES_ANNOUNCE_HIGH_SCORE=0
  -D GAME_DEMO_MODE=0
  ; The keypad reports presses but never a hold, so Breakout's arrows latch the paddle moving instead.
  -D BREAKOUT_TOGGLE_PADDLE=1
  -D BASEUI_HAS_MAP=1
  ; Up/down are free on the Map frame (left/right page frames): zoom with them, no Zoom menu entry.
  -D BASEUI_MAP_UPDOWN_ZOOMS=1
  ; Swipe-aware nav bar, same as t-watch-ultra: the current frame's icon stays highlighted
  ; in the center slot while the rest slide past it in sync with the drag/transition,
  ; instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1
  ; Delete raises INPUT_BROKER_BACK because the text modules read that as backspace, but this
  ; keypad has its own back/cancel key - so delete must not also page to the previous frame.
  -D BASEUI_BACK_PAGES_FRAMES=0
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Colour map tiles from the SD card in device-ui's /maps/<style>/z/x/y.png layout; MAP.BIN when absent.
  -D BASEUI_MAP_PNG_TILES=1
  ; Web server reads a request body 512 bytes per socket read by default; bigger reads speed up SD uploads.
  -D HTTPS_CONNECTION_DATA_CHUNK_SIZE=4096
lib_deps =
  ${thinknode_m9_base.lib_deps}
  # renovate: datasource=git-refs depName=PNGdec packageName=https://github.com/mverch67/PNGdec gitBranch=mverch67-patch-1
  https://github.com/mverch67/PNGdec/archive/d88b6fe2ec8d49c2b097a529b34d1d615ca5cf1b.zip

[env:thinknode_m9-tft]
extends = thinknode_m9_base
build_flags = 
  ${thinknode_m9_base.build_flags}
  -D RADIOLIB_SPI_PARANOID=0
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D HAS_TFT=1
  -D USE_PACKET_API
  -D USE_PIN_BUZZER=PIN_BUZZER
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RAM_SIZE=5120
  -D LGFX_BUFSIZE=153600
  -D LGFX_DRIVER_TEMPLATE
  -D DISPLAY_SIZE=320x240
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  -D VIEW_320x240
  -D LGFX_PANEL=ST7789
  -D LGFX_ROTATION=3
  -D LGFX_CFG_HOST=SPI3_HOST
  -D LGFX_PIN_SCK=40
  -D LGFX_PIN_MOSI=47
  -D LGFX_PIN_DC=15
  -D LGFX_PIN_CS=16
  -D LGFX_PIN_BL=17
  -D LGFX_PIN_RST=14
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_INVERT_LIGHT=true
;  -D MAP_FULL_REDRAW
  -D MUI_WIFI_PS_MIN_MODEM
  -D DEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
  -D DEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD
  -D CHARGING_VOLTAGE=4.25

lib_deps = 
  ${thinknode_m9_base.lib_deps}
  https://github.com/meshtastic/device-ui/archive/70a9967f202a69390460c908a1321e475d3d4cdf.zip ; PR314 input-policy
  https://github.com/mverch67/MultiFTPServer/archive/0e854335b9916ed9f2d3bcfe68975ce746992ccd.zip

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
