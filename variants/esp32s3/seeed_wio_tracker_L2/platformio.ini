[env:seeed_wio_tracker_L2]
custom_meshtastic_hw_model = 137
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L2
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Wio Tracker L2
custom_meshtastic_images = wio_tracker_l2_case.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true

extends = esp32s3_base
board_level = extra
board = seeed_wio_tracker_L2
board_build.partitions = default_16MB.csv
upload_protocol = esptool

; Colour emote data (BASEUI_COLOR_EMOTES) in place of the 1-bit set; the two define the same emotes[].
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/seeed_wio_tracker_L2>
  +<graphics/emotes_color.cpp>
  -<graphics/emotes.cpp>

build_flags = ${esp32s3_base.build_flags} 
  -I variants/esp32s3/seeed_wio_tracker_L2
  -D SEEED_WIO_TRACKER_L2
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D HAS_SCREEN=1
  -D HAS_SDCARD
  -D HAS_SD_MMC ; SDIO mode 1-bit
  -D SD_SCLK_PIN=2
  -D SD_MOSI_PIN=3 ; CMD
  -D SD_MISO_PIN=1 ; D0
  -D SDCARD_CS=-1
  -D I2C_SDA1=13
  -D I2C_SCL1=14
  -D SCAN_I2C1_BUS_RESET
  -D SCAN_SKIP_TCA8418 ; 0x34 false positive on bus 0
  -D WIRE_INTERFACES_COUNT=2 ; e.g. external I2C keyboard
  ; Vendored SAM text-to-speech (Read Aloud), through the ES8311 like the other audio.
  -D MESHTASTIC_ENABLE_TTS
  ; BaseUI. Set here rather than on -tft, which inherits them: this env is the BaseUI-only build.
  -D BASEUI_HAS_MAP=1
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Keep the frame under an open menu or text prompt, so typing redraws the prompt, not the map behind it.
  -D BASEUI_MENU_BACKDROP=1
  ; Colour emote bitmaps from emotes_color.cpp; ones without a colour version stay 1-bit.
  -D BASEUI_COLOR_EMOTES=1
  ; Colour map tiles from the SD card in device-ui's /maps/<style>/z/x/y.png layout; MAP.BIN when absent.
  -D BASEUI_MAP_PNG_TILES=1
  ; Satellite imagery is served as JPEG; decode it too (stored under the same .png names).
  -D BASEUI_MAP_JPEG_TILES=1
  ; Fetch missing tiles over WiFi from /maps/<style>/.url and cache them to the card. On demand only.
  -D BASEUI_MAP_ONLINE_TILES=1
  ; Map > Navigate to a node, waypoint, typed position or (with online tiles) an address.
  -D BASEUI_MAP_NAVIGATION=1
  ; New Waypoint Here: name, note, emote pin and expiry, sent on the primary channel.
  -D BASEUI_WAYPOINT_EDITOR=1
  ; WiFi screen menu: scan, join with a typed password, and rejoin known networks.
  -D BASEUI_WIFI_MANAGER=1
  ; Swipe-aware nav bar: the current frame's icon stays highlighted in the center slot while the
  ; rest slide past it in sync with the drag/transition.
  -D BASEUI_NAV_INFINITE_SCROLL=1
  ; Finger-tracked frame transitions, message/keyboard scrolling and the map's on-screen
  ; controls. A build flag, not a variant.h define: TouchScreenImpl1.h warns it resolves to 0
  ; wherever variant.h is not in the include path.
  -D BASEUI_HAS_TOUCH_DRAG=1
  ; Web server reads a request body 512 bytes per socket read by default; bigger reads speed up SD uploads.
  -D HTTPS_CONNECTION_DATA_CHUNK_SIZE=4096

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
  # renovate: datasource=github-tags depName=BackgroundAudio packageName=earlephilhower/BackgroundAudio
  https://github.com/earlephilhower/BackgroundAudio/archive/refs/tags/1.4.4.zip
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.1.zip
  # renovate: datasource=github-tags depName=Adafruit_ADS1X15 packageName=adafruit/Adafruit_ADS1X15
  https://github.com/adafruit/Adafruit_ADS1X15/archive/refs/tags/2.6.2.zip
  # renovate: datasource=github-tags depName=AW35615 packageName=mverch67/AW35615
  https://github.com/mverch67/AW35615/archive/refs/tags/1.0.1.zip
  # renovate: datasource=git-refs depName=PNGdec packageName=https://github.com/mverch67/PNGdec gitBranch=mverch67-patch-1
  https://github.com/mverch67/PNGdec/archive/d88b6fe2ec8d49c2b097a529b34d1d615ca5cf1b.zip
  # renovate: datasource=github-tags depName=JPEGDEC packageName=bitbank2/JPEGDEC
  https://github.com/bitbank2/JPEGDEC/archive/refs/tags/1.8.4.zip

; Internal DRAM is the scarce pool once WiFi, NimBLE and mbedTLS are all up; 8MB of octal PSRAM takes what it can,
; as on the T-Deck and Indicator. esp32_common turns HTTPClient off via Arduino selective compilation; online tiles,
; address search and routing need it.
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
  '# CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL is not set'
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
  CONFIG_ARDUINO_SELECTIVE_HTTPClient=y
  ; Routing: the free Valhalla/OSRM servers (FOSSGIS, OSRM demo) refuse anything below TLS 1.3.
  CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
  ; not an IDF symbol; read by extra_scripts/esp32_fatfs_exfat.py to patch ffconf.h. LFN comes with it -
  ; FatFs refuses to build exFAT without long filenames.
  CONFIG_FATFS_FS_EXFAT=y
  CONFIG_FATFS_LFN_STACK=y

; The card is SDIO, read through IDF's FatFs by SD_MMC, which mounts exFAT only with the ffconf.h patch this
; script applies. Twice on purpose: pre patches framework-espidf, post re-patches the -libs headers a reinstall wiped.
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:extra_scripts/esp32_fatfs_exfat.py
  post:extra_scripts/esp32_fatfs_exfat.py

[env:seeed_wio_tracker_L2-tft]
extends = env:seeed_wio_tracker_L2
board_level = release

build_flags = ${env:seeed_wio_tracker_L2.build_flags}
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D INPUTDRIVER_BUTTON_TYPE=0
  -D LV_USE_GESTURE_RECOGNITION=1
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_SPI_PARANOID=0
  -D HAS_TFT=1
  -D USE_I2S_BUZZER
  -D RAM_SIZE=5120
  -D LGFX_BUFSIZE=153600
  -D LGFX_DRIVER=LGFX_WIO_TRACKER_L2
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_WIO_TRACKER_L2.h\"
  -D DISPLAY_SIZE=320x240 ; landscape mode
  -D VIEW_320x240
  -D MAP_FULL_REDRAW
  -D USE_PACKET_API

lib_deps =
  ${env:seeed_wio_tracker_L2.lib_deps}
  ${device-ui_base.lib_deps}

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
