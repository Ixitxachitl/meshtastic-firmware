; Heltec Mesh Node T1 nRF52840/SX1262 device
[env:heltec-mesh-node-t1]
custom_meshtastic_hw_model = 133
custom_meshtastic_hw_model_slug = HELTEC_MESH_NODE_T1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Mesh Node T1
custom_meshtastic_images = heltec-meshnode-t1.svg
custom_meshtastic_tags = Heltec

extends = nrf52840_base
board_level = release
board = heltec_mesh_node_t1
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -UOLEDDISPLAY_REDUCE_MEMORY ; TFTDisplay.cpp needs the lib's buffer_back for dirty-window diffing
  -Ivariants/nrf52840/heltec_mesh_node_t1
  -DHELTEC_MESH_NODE_T1
  -DUSE_TFTDISPLAY
  -DUSER_SETUP_LOADED
  -DST7735_DRIVER
  -DST7735_REDTAB160x80
  -D TFT_SPI_PORT=SPI1
  -D TFT_CS=ST7735_CS
  -D TFT_DC=ST7735_RS
  -D TFT_RST=ST7735_RESET
  ; Full-colour BaseUI: draw into an RGB565 frame buffer. The library flag makes its pixel writes
  ; overridable, which the native frame buffer needs; the two must be set together.
  -D BASEUI_NATIVE_RGB565=1
  -D OLEDDISPLAY_OVERRIDABLE_DRAW
  ; Colour emote bitmaps from emotes_color.cpp; ones without a colour version stay 1-bit.
  -D BASEUI_COLOR_EMOTES=1
  ; No touchscreen, so the buttons are the only way to page frames - slide between them rather than snapping.
  -D SCREEN_ANIMATE_FRAME_NAV=1
  ; ...and its two buttons are all it pages with, so they get the slide too, not only left/right.
  -D SCREEN_ANIMATE_BUTTON_NAV=1
  ; Swipe-aware nav bar: the current frame's icon stays highlighted in the center slot while the rest
  ; slide past it in sync with the transition, instead of paging between fixed groups of icons.
  -D BASEUI_NAV_INFINITE_SCROLL=1

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_node_t1>
  +<graphics/emotes_color.cpp>
  -<graphics/emotes.cpp>
lib_deps =
  ${nrf52840_base.lib_deps}
  bodmer/TFT_eSPI@2.5.43
