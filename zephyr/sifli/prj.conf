# Zephyr configuration for the Meshtastic SF32LB52x port.

# ── C++ ──────────────────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n

# ── Peripherals ──────────────────────────────────────────────────────────────
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
# Receive path for the Arduino HardwareSerial shim (console and GNSS ports).
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ENTROPY_GENERATOR=y
# POSIX pieces the firmware links against: setenv()/getenv() for the TZ
# handling in main.cpp, gettimeofday() for the RTC layer.
CONFIG_POSIX_SYSTEM_INTERFACES=y
# std::thread and std::mutex, which device-ui uses when HAS_FREE_RTOS is unset.
CONFIG_POSIX_THREADS=y
# k_thread_stack_alloc(), used by the std::thread shim in the platform layer.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
# timespec_to_timeoutms(), pulled in by the POSIX condition variables.
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_SINGLE_PROCESS=y
CONFIG_XSI_SINGLE_PROCESS=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# ── LittleFS on the storage partition ────────────────────────────────────────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
# ENOENT on a missing file and EEXIST on a duplicate mkdir are expected and
# handled by InternalFileSystem; keep the subsystem's own logging quiet.
CONFIG_FS_LOG_LEVEL_OFF=y

# ── Console / logging over the CH343P USB-UART ───────────────────────────────
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

# ── Stacks. setup() runs RadioLib, NodeDB and BLE init on the main thread. ───
CONFIG_MAIN_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── Fault diagnostics ────────────────────────────────────────────────────────
CONFIG_FAULT_DUMP=2
CONFIG_EXCEPTION_DEBUG=y
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# ── Bluetooth: Zephyr host over the HCI mailbox to the LCPU controller ───────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_FIXED_PASSKEY=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_RX_STACK_SIZE=4096
# Bond storage in the same LittleFS volume as the rest of our state.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/bt_settings"
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# The Meshtastic apps do not implement GATT caching and abort discovery on
# ATT_ERR_DB_OUT_OF_SYNC, so keep the DB static.
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
